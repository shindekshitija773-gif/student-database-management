<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Database Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Student Database Management</h1>
<p>A simple system to manage student records</p>
<form id="studentForm">
<input type="text" id="name" placeholder="Student Name" required>
<input type="text" id="roll" placeholder="Roll No" required>
<input type="text" id="course" placeholder="Course" required>
<button type="submit">Add Student</button>
</form>
<h2>Student Records</h2>
<table id="studentTable">
<thead>
<tr><th>Name</th><th>Roll No</th><th>Course</th><th>Action</th></tr>
</thead>
<tbody></tbody>
</table>
</div>
<script src="script.js"></script>
</body>
</html>
